<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi perfil | TERREPASS</title><link rel="stylesheet" href="TERREPASS_actualizado.css"><style>.perfil-pagina{max-width:850px;margin:40px auto;padding:20px}.perfil-pagina .panel{padding:26px}.perfil-pagina .boton{background:#205081;color:#fff;border:1px solid #7eadd7;padding:10px 16px;border-radius:6px;cursor:pointer}body.tema-oscuro .perfil-volver{color:#a8d1ff}.perfil-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px}.perfil-grid label{display:flex;flex-direction:column;gap:6px;font-weight:600}.perfil-acciones{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:24px}.perfil-volver{color:var(--azul);font-weight:700}.perfil-nota{margin-top:16px;color:var(--suave);font-size:13px}#estado{color:var(--ok);margin-top:12px}@media(max-width:600px){.perfil-grid{grid-template-columns:1fr}}</style></head><body><script>if(localStorage.getItem("geesat_tema_oscuro")==="1")document.body.classList.add("tema-oscuro");</script><main class="perfil-pagina"><section class="panel"><a class="perfil-volver" href="./TERREPASS_actualizado.html">← Volver a TERREPASS</a><h1 style="margin-top:20px">Mi perfil laboral</h1><p>Información de trabajo y contacto institucional</p><form id="perfilForm"><div class="perfil-grid"><label>Rol laboral<input id="rol" readonly></label><label>Nombre completo<input id="nombre" required maxlength="70" autocomplete="name"></label><label>Correo institucional<input id="correo" type="email" maxlength="120" autocomplete="email" placeholder="nombre@establecimiento.cl"></label><label>Establecimiento educacional<input id="establecimiento" maxlength="100"></label><label>Cargo o función<input id="cargo" maxlength="80"></label><label id="campoAsignatura">Asignatura o especialidad<input id="asignatura" maxlength="100"></label><label>Teléfono laboral (opcional)<input id="telefono" type="tel" maxlength="25"></label></div><div class="perfil-acciones"><a class="perfil-volver" href="./TERREPASS_actualizado.html">Volver</a><button type="submit" class="boton">Guardar cambios</button></div><p id="estado" role="status" aria-live="polite"></p></form><p class="perfil-nota">Los datos se guardan en este navegador para cada rol. No se sincronizan con cuentas institucionales.</p></section></main><script>
const rol=localStorage.getItem('geesat_rol')==='profesor'?'profesor':'utp';
const clave=rol==='utp'?'geesat_perfil_utp':'geesat_perfil_profesor';
const claveNombre=rol==='utp'?'geesat_nombre_utp':'geesat_nombre_profesor';
const campos=['nombre','correo','establecimiento','cargo','asignatura','telefono'];
let datos={};try{datos=JSON.parse(localStorage.getItem(clave)||'{}')}catch(e){}
document.getElementById('rol').value=rol==='utp'?'Coordinador/a UTP':'Docente';
document.getElementById('campoAsignatura').hidden=rol==='utp';
for(const campo of campos)document.getElementById(campo).value=datos[campo]||(campo==='nombre'?localStorage.getItem(claveNombre)||'':'');
document.getElementById('perfilForm').addEventListener('submit',e=>{e.preventDefault();if(!e.currentTarget.reportValidity())return;const nuevo=Object.fromEntries(campos.map(c=>[c,document.getElementById(c).value.trim()]));localStorage.setItem(clave,JSON.stringify(nuevo));localStorage.setItem(claveNombre,nuevo.nombre);document.getElementById('estado').textContent='Datos laborales guardados correctamente.';});
</script></body></html>
